name: Greengage Reusable ORCA Tests

# Environment variables
env:
  COMPOSE_HTTP_TIMEOUT: 400
  DOCKER_COMPOSE: "docker compose"

# Trigger for reusable workflow
on:
  workflow_call:
    inputs:
      version:
        description: 'Greengage version (e.g., 6 or 7)'
        required: true
        type: string
      target_os:
        description: 'Target OS (e.g., ubuntu)'
        required: true
        type: string
      target_os_version:
        description: 'Target OS version (e.g., 24.04)'
        required: false
        type: string
        default: ''
      python3:
        description: 'Python3 build argument (ignored)'
        required: false
        type: string
        default: ''
    secrets:
      ghcr_token:
        description: 'GitHub token for GHCR access'
        required: true

jobs:
  orca:
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # Explicit for default behavior
      actions: write  # Required for cache and artifact upload
    steps:
      - name: Maximize disk space
        uses: greengagedb/greengage-ci/.github/actions/maximize-disk-space@v19

      - name: Enable Docker IPv6
        uses: greengagedb/greengage-ci/.github/actions/enable-docker-ipv6@v51

      # Checkout repository with shallow clone
      - name: Checkout Greengage repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          submodules: recursive

      - name: Restore & Load SHA image
        uses: greengagedb/greengage-ci/.github/actions/restore-load-image@v25
        with:
          version: ${{ inputs.version }}
          target_os: ${{ inputs.target_os }}
          target_os_version: ${{ inputs.target_os_version }}

      # Run ORCA Linter
      - name: ORCA Linter
        run: |
          docker build -t orca-linter:test -f ci/Dockerfile.linter .
          docker run      orca-linter:test

      # Run ORCA Unit test using the passed image tag
      - name: ORCA Unit test
        env:
          IMAGE: ghcr.io/${{ github.repository }}/ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}:${{ github.sha }}
        run: |
          export IMAGE=${IMAGE,,}
          docker run \
            -v $(pwd)/logs:/home/gpadmin/logs \
            $IMAGE /bin/bash -c '
              gpdb_src/concourse/scripts/unit_tests_gporca.bash
              exitcode=$?
              cp -rf gpdb_src/src/backend/gporca/build/Testing/Temporary/* logs/ 2>/dev/null
              exit $exitcode
              '

      # Upload ORCA artifacts
      - name: Upload ORCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}_ggdb${{ inputs.version }}_${{ inputs.target_os }}${{ inputs.target_os_version }}
          path: logs
          retention-days: 7
          if-no-files-found: warn  # Warning if no artifacts are found
