# .github/actions/enable-docker-ipv6/action.yml
# Strongly recommended use current caller workflow tag!
name: "Enable Docker IPv6"
description: "Configure the Docker daemon to hand out IPv6 addresses to containers, by analogy with the GitLab IPv6 runner image"

inputs:
  fixed-cidr-v6:
    description: 'IPv6 subnet Docker assigns to containers (daemon.json "fixed-cidr-v6")'
    required: false
    default: '2001:db8:1::/64'

runs:
  using: "composite"
  steps:
    - name: Configure Docker daemon for IPv6
      shell: bash
      env:
        FIXED_CIDR_V6: ${{ inputs.fixed-cidr-v6 }}
      run: |
        set -e
        sudo mkdir -p /etc/docker
        [ -f /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null

        tmp=$(mktemp)
        jq --arg cidr "$FIXED_CIDR_V6" '. + {ipv6: true, "fixed-cidr-v6": $cidr}' \
          /etc/docker/daemon.json > "$tmp"
        sudo chown root:root "$tmp"
        sudo chmod 644 "$tmp"
        sudo mv "$tmp" /etc/docker/daemon.json

        sudo systemctl restart docker

    - name: Verify IPv6 is available to containers
      shell: bash
      run: |
        docker run --rm alpine:3 sh -c '
          set -e
          ip -6 addr show scope global | grep -q "inet6" || {
            echo "::error::Docker did not assign a non-link-local IPv6 address to the container"
            exit 1
          }
        '
